name: AI PR Review (NVIDIA)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai_review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate AI review comment (NVIDIA)
        uses: actions/github-script@v7
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          MAX_DIFF_CHARS: ${{ vars.AI_REVIEW_MAX_DIFF_CHARS }}
          AI_REVIEW_INCLUDE_EXTENSIONS: ${{ vars.AI_REVIEW_INCLUDE_EXTENSIONS }}
          AI_REVIEW_EXCLUDE_PATHS: ${{ vars.AI_REVIEW_EXCLUDE_PATHS }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const apiKey = (process.env.NVIDIA_API_KEY || '').trim();
            const baseUrl = (process.env.NVIDIA_BASE_URL || 'https://integrate.api.nvidia.com/v1').replace(/\/+$/, '');
            const model = (process.env.NVIDIA_MODEL || 'openai/gpt-oss-20b').trim();
            const maxChars = parseInt((process.env.MAX_DIFF_CHARS || '120000').trim(), 10);

            // Defaults: non-blocking workflow + focus on code files.
            // Configure via repo variables if you want different behavior.
            const defaultExcludePaths = ['.github/', 'dist/', 'build/', 'node_modules/'];
            const defaultIncludeExtensions = ['.cs', '.ts', '.tsx', '.js', '.jsx', '.py', '.java', '.kt', '.go', '.rs', '.cpp', '.h', '.hpp', '.c', '.yaml', '.yml', '.json', '.md'];

            if (!apiKey) {
              await postOrUpdateComment('Missing secret NVIDIA_API_KEY. Add it in GitHub repo Settings → Secrets and variables → Actions.');
              core.warning('Missing secret NVIDIA_API_KEY');
              return; // non-blocking
            }

            // ----- 1) Gather PR metadata
            const pr = await github.rest.pulls.get({ owner, repo, pull_number });
            const title = pr.data.title || '';
            const prBody = pr.data.body || '';
            const base = pr.data.base?.ref;
            const head = pr.data.head?.ref;

            // ----- 2) Gather PR files and patch (diff hunks)
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const includeExtensionsVar = (process.env.AI_REVIEW_INCLUDE_EXTENSIONS || '').trim();
            const excludePathsVar = (process.env.AI_REVIEW_EXCLUDE_PATHS || '').trim();

            const includeSet = includeExtensionsVar
              ? new Set(includeExtensionsVar.split(',').map(s => s.trim()).filter(Boolean))
              : new Set(defaultIncludeExtensions);

            const excludeMatchers = excludePathsVar
              ? excludePathsVar.split(',').map(s => s.trim()).filter(Boolean)
              : defaultExcludePaths;

            function isExcluded(filename) {
              return excludeMatchers.some(m => filename.startsWith(m));
            }

            function extOf(filename) {
              const idx = filename.lastIndexOf('.');
              return idx === -1 ? '' : filename.slice(idx);
            }

            // Select files with patch only (skip binaries/too-large without patch)
            const selected = files
              .filter(f => !!f.patch)
              .filter(f => !isExcluded(f.filename))
              .filter(f => includeSet.has(extOf(f.filename)))
              .map(f => ({
                filename: f.filename,
                status: f.status,
                additions: f.additions,
                deletions: f.deletions,
                patch: f.patch || ''
              }));

            let diffText = '';
            for (const f of selected) {
              const header = `\n\n### ${f.filename} (${f.status}, +${f.additions}/-${f.deletions})\n`;
              const patch = `\n${f.patch}\n`;
              if ((diffText.length + header.length + patch.length) > maxChars) {
                diffText += `\n\n...diff truncated at ~${maxChars} characters...`;
                break;
              }
              diffText += header + patch;
            }

            if (!diffText.trim()) {
              await postOrUpdateComment('No textual diff hunks found to review (all files may be binary or excluded).');
              return; // non-blocking
            }

            // ----- 3) Call NVIDIA (OpenAI-compatible)
            // This model often returns `message.reasoning` with `message.content=null`.
            // We extract a clean "final" review by instructing the model to output only markdown.
            const systemPrompt = [
              'You are a senior software engineer doing a pull request review.',
              'Write a concise, actionable review of the changes.',
              'Focus on: correctness, security, performance, tests, maintainability.',
              'Output ONLY markdown (no preamble, no meta commentary, no chain-of-thought).',
              'Use this structure exactly:',
              '## Summary',
              '- ...',
              '## Must fix (blocking)',
              '- ... (or "- None")',
              '## Suggestions (non-blocking)',
              '- ... (or "- None")',
              '## Tests',
              '- ... (or "- None")'
            ].join(' ');

            const userPrompt = [
              `Repo: ${owner}/${repo}`,
              `PR #${pull_number}: ${title}`,
              `Base: ${base}  Head: ${head}`,
              '',
              'PR description:',
              prBody || '(empty)',
              '',
              'Diff:',
              diffText
            ].join('\n');

            const url = `${baseUrl}/chat/completions`;

            const res = await fetch(url, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': `Bearer ${apiKey}`,
              },
              body: JSON.stringify({
                model,
                temperature: 0.2,
                top_p: 1,
                max_tokens: 900,
                stream: false,
                // Some NVIDIA models may support it; safe if ignored.
                reasoning_effort: 'low',
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: userPrompt },
                ],
              }),
            });

            const text = await res.text();
            let data;
            try { data = JSON.parse(text); } catch { data = null; }

            if (!res.ok) {
              await postOrUpdateComment(`NVIDIA API request failed: ${res.status} ${res.statusText}\nURL: ${url}\n${text}`);
              core.warning('NVIDIA API request failed');
              return; // non-blocking
            }

            const msg = data?.choices?.[0]?.message;
            let review = (
              msg?.content ??
              msg?.reasoning_content ??
              msg?.reasoning ??
              data?.choices?.[0]?.text ??
              ''
            ).toString().trim();

            if (!review) {
              const snippet = text.length > 2000 ? text.slice(0, 2000) + '\n...<truncated>...' : text;
              await postOrUpdateComment(`Model ${model} returned empty content. Raw response snippet:\n${snippet}`);
              return; // non-blocking
            }

            // Cleanup: remove common "thinking" preambles if present
            review = review
              .replace(/^\s*(We need to review\s+PR\.?\s*)/i, '')
              .trim();

            const marker = '<!-- ai-pr-review:nvidia -->';
            const commentBody = [
              marker,
              '## AI Code Review',
              '',
              review,
              '',
              '---',
              `Provider: NVIDIA`,
              `Model: \`${model}\``
            ].join('\n');

            await postOrUpdateComment(null, commentBody);

            async function postOrUpdateComment(errorText, successBody) {
              const marker = '<!-- ai-pr-review:nvidia -->';
              const body = successBody || [
                marker,
                '## AI Code Review',
                '',
                '⚠️ AI review could not be generated (non-blocking).',
                '',
                '### Details',
                '```',
                errorText || 'Unknown error',
                '```',
                '',
                '### How to fix',
                '- Ensure `NVIDIA_API_KEY` secret is present.',
                '- Set repository variable `NVIDIA_MODEL` to a model you have access to (see https://build.nvidia.com/).',
                '- Keep `NVIDIA_BASE_URL` empty unless you changed it; default is `https://integrate.api.nvidia.com/v1`.',
              ].join('\n');

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pull_number,
                per_page: 100,
              });
              const existing = comments.find(c => (c.body || '').includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
              }
            }
