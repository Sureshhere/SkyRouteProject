name: AI PR Review (NVIDIA)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ai_review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate AI review comment (NVIDIA)
        uses: actions/github-script@v7
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          MAX_DIFF_CHARS: ${{ vars.AI_REVIEW_MAX_DIFF_CHARS }}
          AI_REVIEW_INCLUDE_EXTENSIONS: ${{ vars.AI_REVIEW_INCLUDE_EXTENSIONS }}
          AI_REVIEW_EXCLUDE_PATHS: ${{ vars.AI_REVIEW_EXCLUDE_PATHS }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Support both pull_request event and manual workflow_dispatch
            const pull_number = context.payload.pull_request?.number;
            if (!pull_number) {
              core.warning('No pull_request found in event payload. This workflow is intended to run on pull_request events.');
              return;
            }

            const apiKey = (process.env.NVIDIA_API_KEY || '').trim();
            const baseUrl = (process.env.NVIDIA_BASE_URL || 'https://integrate.api.nvidia.com/v1').replace(/\/+$/, '');
            const model = (process.env.NVIDIA_MODEL || 'openai/gpt-oss-20b').trim();
            const maxChars = parseInt((process.env.MAX_DIFF_CHARS || '120000').trim(), 10);

            // Best defaults:
            // - Non-blocking: never fails the job (won't block merges)
            // - Reviews only text diffs (patch hunks)
            // - Focuses on typical code/doc files and ignores noisy paths
            const defaultExcludePaths = ['.github/', 'dist/', 'build/', 'node_modules/'];
            const defaultIncludeExtensions = ['.cs', '.ts', '.tsx', '.js', '.jsx', '.py', '.java', '.kt', '.go', '.rs', '.cpp', '.h', '.hpp', '.c', '.yaml', '.yml', '.json', '.md'];

            // Helper: post/update a single sticky comment
            async function postOrUpdateComment(body) {
              const marker = '<!-- ai-pr-review:nvidia -->';
              const fullBody = body.includes(marker) ? body : [marker, body].join('\n');

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pull_number,
                per_page: 100,
              });
              const existing = comments.find(c => (c.body || '').includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: fullBody });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body: fullBody });
              }
            }

            // Diagnostic ping so you always see *some* comment when it runs
            // (helps when people think it didn't post because it updates the same comment)
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            if (!apiKey) {
              await postOrUpdateComment([
                '## AI Code Review',
                '',
                '⚠️ AI review could not be generated (non-blocking).',
                '',
                `Workflow run: ${runUrl}`,
                '',
                '### Details',
                '```',
                'Missing secret NVIDIA_API_KEY. Add it in GitHub repo Settings → Secrets and variables → Actions.',
                '```',
              ].join('\n'));
              core.warning('Missing secret NVIDIA_API_KEY');
              return;
            }

            // ----- 1) Gather PR metadata
            const pr = await github.rest.pulls.get({ owner, repo, pull_number });
            const title = pr.data.title || '';
            const prBody = pr.data.body || '';
            const base = pr.data.base?.ref;
            const head = pr.data.head?.ref;

            // ----- 2) Gather PR files and patch (diff hunks)
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const includeExtensionsVar = (process.env.AI_REVIEW_INCLUDE_EXTENSIONS || '').trim();
            const excludePathsVar = (process.env.AI_REVIEW_EXCLUDE_PATHS || '').trim();

            const includeSet = includeExtensionsVar
              ? new Set(includeExtensionsVar.split(',').map(s => s.trim()).filter(Boolean))
              : new Set(defaultIncludeExtensions);

            const excludeMatchers = excludePathsVar
              ? excludePathsVar.split(',').map(s => s.trim()).filter(Boolean)
              : defaultExcludePaths;

            function isExcluded(filename) {
              return excludeMatchers.some(m => filename.startsWith(m));
            }

            function extOf(filename) {
              const idx = filename.lastIndexOf('.');
              return idx === -1 ? '' : filename.slice(idx);
            }

            // Select files with patch only (skip binaries/too-large without patch)
            const selected = files
              .filter(f => !!f.patch)
              .filter(f => !isExcluded(f.filename))
              .filter(f => includeSet.has(extOf(f.filename)))
              .map(f => ({
                filename: f.filename,
                status: f.status,
                additions: f.additions,
                deletions: f.deletions,
                patch: f.patch || ''
              }));

            let diffText = '';
            for (const f of selected) {
              const header = `\n\n### ${f.filename} (${f.status}, +${f.additions}/-${f.deletions})\n`;
              const patch = `\n${f.patch}\n`;
              if ((diffText.length + header.length + patch.length) > maxChars) {
                diffText += `\n\n...diff truncated at ~${maxChars} characters...`;
                break;
              }
              diffText += header + patch;
            }

            if (!diffText.trim()) {
              await postOrUpdateComment([
                '## AI Code Review',
                '',
                '⚠️ Nothing to review (non-blocking).',
                '',
                `Workflow run: ${runUrl}`,
                '',
                'No textual diff hunks were found (all files may be binary/too large/excluded).',
              ].join('\n'));
              return;
            }

            // ----- 3) Call NVIDIA (OpenAI-compatible)
            const systemPrompt = [
              'You are a senior software engineer doing a pull request review.',
              'Review ONLY the provided diff hunks. You do NOT have access to the full repository.',
              'Never claim something is missing or broken unless it is directly visible in the diff.',
              'When you are unsure, write it as a question under "Risks to validate".',
              'Every bullet under "Findings (from diff)" MUST start with a file path from the diff, e.g. "path/to/file.cs: ...".',
              'Keep the review concise (max ~12 bullets total across all sections).',
              'Output ONLY markdown. No preamble, no meta commentary, no chain-of-thought.'
            ].join(' ');

            const userPrompt = [
              `Repo: ${owner}/${repo}`,
              `PR #${pull_number}: ${title}`,
              `Base: ${base}  Head: ${head}`,
              '',
              'PR description:',
              prBody || '(empty)',
              '',
              'Diff hunks:',
              diffText,
              '',
              'Return markdown with this exact structure:',
              '## Summary',
              '## Findings (from diff)',
              '- file: finding',
              '## Risks to validate (needs repo context)',
              '- question/check',
              '## Suggestions',
              '- suggestion',
              '## Tests',
              '- test suggestion',
            ].join('\n');

            const url = `${baseUrl}/chat/completions`;

            const res = await fetch(url, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': `Bearer ${apiKey}`,
              },
              body: JSON.stringify({
                model,
                temperature: 0.2,
                top_p: 1,
                max_tokens: 900,
                stream: false,
                reasoning_effort: 'low',
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: userPrompt },
                ],
              }),
            });

            const text = await res.text();
            let data;
            try { data = JSON.parse(text); } catch { data = null; }

            if (!res.ok) {
              await postOrUpdateComment([
                '## AI Code Review',
                '',
                '⚠️ AI review could not be generated (non-blocking).',
                '',
                `Workflow run: ${runUrl}`,
                '',
                '### Details',
                '```',
                `NVIDIA API request failed: ${res.status} ${res.statusText}`,
                `URL: ${url}`,
                text,
                '```',
              ].join('\n'));
              core.warning('NVIDIA API request failed');
              return;
            }

            // Provider may put text in content or reasoning. Prefer content, but fall back.
            const msg = data?.choices?.[0]?.message;
            let review = (
              msg?.content ??
              msg?.reasoning_content ??
              msg?.reasoning ??
              data?.choices?.[0]?.text ??
              ''
            ).toString().trim();

            if (!review) {
              const snippet = text.length > 2000 ? text.slice(0, 2000) + '\n...<truncated>...' : text;
              await postOrUpdateComment([
                '## AI Code Review',
                '',
                '⚠️ AI review could not be generated (non-blocking).',
                '',
                `Workflow run: ${runUrl}`,
                '',
                '### Details',
                '```',
                `Model ${model} returned empty content. Raw response snippet:`,
                snippet,
                '```',
              ].join('\n'));
              return;
            }

            // Cleanup: remove common "thinking" preambles if present
            review = review
              .replace(/^\s*(We need to review\s+PR\.?\s*)/i, '')
              .trim();

            const commentBody = [
              '## AI Code Review',
              '',
              review,
              '',
              '---',
              `Workflow run: ${runUrl}`,
              `Provider: NVIDIA`,
              `Model: \`${model}\``
            ].join('\n');

            await postOrUpdateComment(commentBody);
